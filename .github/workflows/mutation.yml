name: mutation

# Только ручной запуск владельцем. В PR и по расписанию не запускается.
on:
  push:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files:
    name: Модульные тесты и список файлов
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - id: files
        run: echo "files=$(node tools/quality.mjs mutate-files)" >> "$GITHUB_OUTPUT"

  # По заданию на файл; задания идут одновременно.
  # Упавшее задание не отменяет остальные: все выжившие мутации видны за один запуск.
  mutation:
    name: ${{ matrix.file }}
    needs: files
    if: needs.files.outputs.files != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.files.outputs.files) }}
    env:
      FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/unclebob
      - name: Проверка всех мест мутаций файла
        run: node tools/quality.mjs mutate "$FILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports-${{ strategy.job-index }}
          include-hidden-files: true
          path: .metrics/mutate/
          if-no-files-found: warn

  reports:
    name: Общий набор отчётов
    needs: mutation
    if: always() && needs.mutation.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: mutation-reports
          pattern: mutation-reports-*
          delete-merged: true
